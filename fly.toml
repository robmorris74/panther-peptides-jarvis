app = "panther-peptides-jarvis"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/operator.db"
  JARVIS_CONFIG_PATH = "/data/jarvis.env"
  JARVIS_COOKIE_SECURE = "true"
  JARVIS_ENV = "production"
  # Set JARVIS_BOOTSTRAP_TOKEN as a Fly secret before first launch.

[[mounts]]
  source = "jarvis_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health/live"
